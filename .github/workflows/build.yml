name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            qt6-base-dev qt6-websockets-dev \
            libmpv-dev libspdlog-dev libqrencode-dev \
            libbrotli-dev libgl-dev \
            cmake g++

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliveAudio-linux
          path: build/BiliveAudio

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          vcpkgGitCommitId: "latest"

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Build
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Package
        run: |
          windeployqt build/Release/BiliveAudio.exe
          Compress-Archive -Path build/Release/* -DestinationPath BiliveAudio-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliveAudio-windows
          path: BiliveAudio-windows.zip
