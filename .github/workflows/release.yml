name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            qt6-base-dev qt6-websockets-dev \
            libmpv-dev libspdlog-dev libqrencode-dev libbrotli-dev libjemalloc-dev \
            libgl-dev libfuse2 \
            cmake g++

      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j$(nproc)

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /tmp/linuxdeploy-plugin-qt
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/BiliveAudio AppDir/usr/bin/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/biliveaudio.png

      - name: Create desktop entry
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/biliveaudio.desktop << EOF
          [Desktop Entry]
          Name=BiliveAudio
          Comment=Bilibili Live Audio Player
          Exec=BiliveAudio
          Icon=biliveaudio
          Type=Application
          Categories=Audio;Network;
          Terminal=false
          EOF

      - name: Build AppImage
        run: |
          export LDAI_OUTPUT="BiliveAudio-x86_64.AppImage"
          /tmp/linuxdeploy --appdir AppDir --plugin qt --output appimage

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliveAudio-x86_64.AppImage
          tag: ${{ github.ref }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: vcpkg-installed-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          vcpkgConfigurationJsonGlob: vcpkg-configuration.json
          runVcpkgInstall: true

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Download mpv from NuGet
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Endpne.LibMPV.Windows/0.39.0" -OutFile "$env:RUNNER_TEMP\mpv.nupkg"
          Expand-Archive -Path "$env:RUNNER_TEMP\mpv.nupkg" -DestinationPath "$env:RUNNER_TEMP\mpv"
          echo "MPV_INCLUDE_DIR=$env:RUNNER_TEMP\mpv\build\x64\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "MPV_LIBRARY_RELEASE=$env:RUNNER_TEMP\mpv\build\x64\libmpv-2.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DMPV_INCLUDE_DIR="$env:MPV_INCLUDE_DIR" `
            -DMPV_LIBRARY_RELEASE="$env:MPV_LIBRARY_RELEASE"
          cmake --build build --config Release

      - name: Stage mpv DLL
        run: |
          Copy-Item "$env:RUNNER_TEMP\mpv\build\x64\libmpv-2.dll" build\Release\
          Copy-Item "$env:RUNNER_TEMP\mpv\build\x64\*.dll" build\Release\

      - name: Package
        run: |
          windeployqt build\Release\BiliveAudio.exe
          del build\Release\*.pdb
          Compress-Archive -Path build\Release\* -DestinationPath BiliveAudio-windows.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliveAudio-windows.zip
          tag: ${{ github.ref }}
