name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            qt6-base-dev qt6-websockets-dev \
            libmpv-dev libspdlog-dev libqrencode-dev \
            libbrotli-dev libgl-dev libfuse2 \
            cmake g++ imagemagick

      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j$(nproc)

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /tmp/linuxdeploy-plugin-qt
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp build/BiliveAudio AppDir/usr/bin/

      - name: Create desktop entry
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/biliveaudio.desktop << EOF
          [Desktop Entry]
          Name=BiliveAudio
          Comment=Bilibili Live Audio Player
          Exec=BiliveAudio
          Icon=biliveaudio
          Type=Application
          Categories=Audio;Network;
          Terminal=false
          EOF

      - name: Create icon
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert -size 256x256 xc:'#533483' -fill white -gravity center \
            -pointsize 120 -annotate 0 'B' \
            AppDir/usr/share/icons/hicolor/256x256/apps/biliveaudio.png

      - name: Build AppImage
        run: |
          export LDAI_OUTPUT="BiliveAudio-x86_64.AppImage"
          /tmp/linuxdeploy --appdir AppDir --plugin qt --output appimage

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliveAudio-x86_64.AppImage
          tag: ${{ github.ref }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Download mpv dev
        shell: pwsh
        run: |
          $url = "https://www.nuget.org/api/v2/package/mpv/0.28.2"
          Write-Host "Downloading mpv 0.28.2 from NuGet ..."
          Invoke-WebRequest -Uri $url -OutFile mpv.nupkg -UseBasicParsing
          New-Item -ItemType Directory -Force -Path mpv_root | Out-Null
          Expand-Archive -Path mpv.nupkg -DestinationPath mpv_root -Force
          $headerDir = "$(Resolve-Path mpv_root)\Include"
          # NuGet puts client.h directly in Include/, need Include/mpv/client.h
          if (Test-Path "$headerDir/client.h" -and -not (Test-Path "$headerDir/mpv/client.h")) {
            New-Item -ItemType Directory -Force -Path "$headerDir/mpv" | Out-Null
            Copy-Item "$headerDir/client.h" "$headerDir/mpv/client.h"
          }
          echo "MPV_INCLUDE_DIR=$headerDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "MPV_LIBRARY=$(Resolve-Path mpv_root)\bin\x64\mpv.lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "MPV_DLL_DIR=$(Resolve-Path mpv_root)\bin\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "mpv ready"

      - name: Strip mpv DLL
        shell: pwsh
        run: |
          $dll = "${{ env.MPV_DLL_DIR }}\mpv-1.dll"
          Write-Host "Before: $((Get-Item $dll).Length / 1MB) MB"
          # Use dumpbin to check for debug info
          $hdr = & dumpbin /headers $dll
          if ($hdr -match 'debug directory') {
            Write-Host "Has debug info, stripping..."
            # strip via Git for Windows (available on path)
            & strip --strip-all $dll 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "After: $((Get-Item $dll).Length / 1MB) MB"
            } else {
              Write-Host "strip not available, skipping"
            }
          } else {
            Write-Host "No embedded debug info, nothing to strip"
          }

      - name: Build
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DMPV_INCLUDE_DIR="${{ env.MPV_INCLUDE_DIR }}" `
            -DMPV_LIBRARY="${{ env.MPV_LIBRARY }}"
          cmake --build build --config Release

      - name: Package
        run: |
          copy "${{ env.MPV_DLL_DIR }}\mpv-1.dll" build\Release\
          windeployqt build\Release\BiliveAudio.exe
          del build\Release\*.pdb
          Compress-Archive -Path build\Release\* -DestinationPath BiliveAudio-windows.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliveAudio-windows.zip
          tag: ${{ github.ref }}
